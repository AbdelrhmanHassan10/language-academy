<section class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 py-10 lg:py-20 items-center overflow-hidden">
  <!-- Content Column -->
  <div class="lang-content order-2 lg:order-1 lg:pe-8" data-aos="fade-up" data-aos-duration="1000">
    <div class="mb-12">
      <h2 class="text-3xl lg:text-5xl font-extrabold mb-6 leading-[1.4] global-text-gradient-light">
        ليه تختار مركز اللغات والترجمة؟
      </h2>
      <p class="text-lg lg:text-xl font-normal text-white/80 leading-relaxed max-w-xl">
        نحن أكثر من مجرد مركز اختبارات، نحن شريكك في النجاح الأكاديمي والمهني من خلال خدمات تعليمية متكاملة تواكب طموحاتك.
      </p>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-14">
      @for (item of langData(); track $index) {
        <div class="group bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/30 rounded-3xl p-6 lg:p-8 transition-all duration-300" data-aos="fade-up" [attr.data-aos-delay]="$index * 100">
          <div class="flex items-center gap-4 mb-5">
            <div class="flex items-center justify-center w-14 h-14 bg-white/10 rounded-2xl shrink-0 transition-transform duration-300 group-hover:scale-110">
              <img [src]="item.icon" [alt]="item.title" class="w-7 h-7 filter brightness-0 invert" />
            </div>
            <h3 class="text-xl lg:text-2xl font-bold text-white">{{ item.title }}</h3>
          </div>
          <p class="text-base font-normal text-white/70 leading-relaxed">{{ item.description }}</p>
        </div>
      }
    </div>
    
    <div data-aos="fade-up" data-aos-delay="400">
      <a
      class="inline-flex items-center justify-center gap-3 px-10 py-4 text-[#0066CC] text-lg font-bold bg-white rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.12)] hover:shadow-[0_15px_40px_rgba(0,0,0,0.2)] hover:-translate-y-1 transition-all duration-300 group global-btn-glow"
      routerLink="services"
      >
        اكتشف المزيد عن خدماتنا
        <i class="pi pi-arrow-left text-sm transition-transform duration-300 group-hover:-translate-x-2"></i>
      </a>
    </div>
  </div>
  
  <!-- Image Column -->
  <div class="relative order-1 lg:order-2 mt-8 lg:mt-0" data-aos="zoom-in" data-aos-duration="1200">
    <div class="relative rounded-[2rem] overflow-hidden shadow-2xl">
      <img
        src="/images/lang.webp"
        alt="Why choose us"
        class="w-full h-[400px] lg:h-[650px] object-cover transition-transform duration-700 hover:scale-105"
      />
    </div>
    
    <!-- Floating Success Card -->
    <div
      class="absolute -bottom-8 start-8 lg:bottom-16 lg:-start-12 shadow-2xl bg-white rounded-[2rem] p-8 flex flex-col items-center justify-center global-animate-float z-20"
    >
      <div class="w-14 h-14 rounded-2xl bg-blue-50 flex items-center justify-center mb-4">
        <i class="pi pi-chart-line text-[#0066CC] text-2xl"></i>
      </div>
      <p class="text-4xl lg:text-6xl font-extrabold text-[#0066CC] mb-2 tracking-tight">98%</p>
      <p class="text-base font-bold text-gray-500">معدل نجاح الطلاب</p>
    </div>
  </div>
</section>
