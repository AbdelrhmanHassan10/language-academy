<section class="w-full bg-white py-16" dir="rtl">
  <div class="max-w-[1216px] mx-auto px-4 sm:px-0">

    <h2 class="text-xl md:text-[30px] leading-7 md:leading-[36px] text-[#101828] mb-6">
      كورسات مشابهة
    </h2>

    <!-- Loading -->
    @if (loading()) {
      <div class="flex justify-center items-center py-20">
        <div class="w-12 h-12 border-4 border-[#0066CC] border-t-transparent rounded-full animate-spin"></div>
      </div>
    }

    <!-- Error -->
    @if (error()) {
      <div class="text-center py-10">
        <p class="text-red-500 mb-4">{{ error() }}</p>
        <button (click)="loadCourses()" class="bg-[#0066CC] text-white px-6 py-2 rounded-xl">
          إعادة المحاولة
        </button>
      </div>
    }

    <!-- Cards -->
    @if (!loading() && !error()) {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (course of similarCourses(); track course.id) {
          <div (click)="navigateToCourse(course.id)"
            class="w-full bg-white border-[1.6px] border-[#F3F4F6] rounded-2xl flex flex-col overflow-hidden hover:shadow-md transition-shadow"
          >
            <div class="relative w-full h-40 md:h-[160px]">
              <img [src]="course.cover_image" [alt]="course.name" class="w-full h-full object-cover rounded-t-2xl" />
              <div class="absolute top-3 left-3 bg-white/90 rounded-full px-2 py-1 flex items-center gap-1">
                <span class="text-xs text-[#101828]">{{ course.level_translated }}</span>
              </div>
            </div>

            <div class="p-4 md:p-5 flex flex-col gap-2 md:gap-3">
              <h3 class="text-base md:text-[18px] leading-6 md:leading-[28px] text-[#101828]">
                {{ course.name }}
              </h3>
              <div class="flex justify-between items-center text-sm md:text-base">
                <span class="text-[#4A5565]">{{ course.available_seats }} مقعد</span>
                <span class="text-[#0066CC] text-lg md:text-[20px]">{{ course.price }}</span>
              </div>
            </div>
          </div>
        } @empty {
          <p class="col-span-3 text-center text-gray-400 py-10">لا توجد كورسات مشابهة</p>
        }
      </div>
    }

  </div>
</section>
