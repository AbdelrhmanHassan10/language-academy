@if (educationalCards().length > 0) {
  <section class="container mx-auto px-4 sm:px-6 lg:px-8 py-16 lg:py-24 bg-[#F8FAFC]">
    <div class="flex flex-col items-center justify-center gap-4 mb-16 text-center" data-aos="fade-up">
      <h2 class="text-4xl lg:text-5xl font-black leading-tight">
        <span class="text-[#00B2A9]">رؤيتنا</span> <span class="text-[#0066CC]">ورسالتنا</span>
      </h2>
      <p class="text-lg lg:text-xl text-[#64748B] font-medium max-w-2xl mx-auto">
        نسعى للريادة والتميز في كل ما نقدمه من خدمات تعليمية وتدريبية
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-10">
      @for (card of educationalCards(); track card.id; let i = $index) {
        <div
          data-aos="fade-up" [attr.data-aos-delay]="(i % 3) * 150"
          class="group relative bg-white rounded-[2rem] p-8 lg:p-10 shadow-[0_10px_30px_rgba(0,0,0,0.03)] hover:shadow-[0_20px_50px_rgba(0,102,204,0.1)] transition-all duration-300 hover:-translate-y-2 border border-gray-100 hover:border-blue-100 flex flex-col items-center text-center h-full"
        >
          <div
            [style.background-color]="card.bgColor"
            class="w-16 h-16 rounded-2xl flex items-center justify-center mb-6 shadow-sm group-hover:scale-110 transition-transform duration-300"
          >
            <img [src]="card.icon" [alt]="card.title" class="w-8 h-8 filter brightness-0 invert" />
          </div>

          <h3
            class="text-xl font-black text-[#0066CC] mb-4"
          >
            {{ card.title }}
          </h3>

          <p class="text-[#64748B] text-base leading-relaxed font-medium flex-grow">
            {{ card.description }}
          </p>

          <div
            class="w-12 h-1 bg-gray-100 rounded-full mt-6 group-hover:bg-[#00B2A9] transition-colors duration-300"
          ></div>
        </div>
      }
    </div>
  </section>
}
