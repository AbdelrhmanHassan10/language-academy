@if (contactCards().length > 0) {
<section class="container mx-auto py-12 lg:py-20 max-w-[1400px]" dir="rtl">
  
  <div class="text-center mb-16" data-aos="fade-down" data-aos-duration="1000">
    <h2 class="text-3xl md:text-4xl lg:text-5xl font-extrabold text-[#1e293b] mb-4">
      كيف يمكننا <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#0066CC] to-[#00B2A9]">مساعدتك؟</span>
    </h2>
    <p class="text-lg md:text-xl text-[#64748B] font-medium max-w-2xl mx-auto">
      نحن هنا للرد على استفساراتك وتقديم الدعم الذي تحتاجه
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 xl:gap-8">
    @for (card of contactCards(); track card.id; let i = $index) {
      <div
        data-aos="fade-up" [attr.data-aos-delay]="(i % 4) * 100" data-aos-duration="800"
        class="group relative bg-white rounded-[2rem] p-8 shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_20px_40px_rgb(0,102,204,0.08)] transition-all duration-500 hover:-translate-y-2 border border-gray-100 overflow-hidden flex flex-col items-center text-center z-10"
      >
        <!-- Background decorative blob -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-gradient-to-br from-[#0066CC]/5 to-[#00B2A9]/5 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700 -z-10"></div>
        
        <!-- Icon Container -->
        <div class="relative w-20 h-20 rounded-[1.5rem] bg-gradient-to-br from-[#0066CC] to-blue-500 flex items-center justify-center mb-6 shadow-lg shadow-blue-500/20 group-hover:scale-110 transition-transform duration-500">
          <img [src]="card.icon" [alt]="card.title" class="w-10 h-10 brightness-0 invert object-contain" />
        </div>
        
        <h3 class="text-xl lg:text-2xl font-bold text-[#1e293b] mb-3 group-hover:text-[#0066CC] transition-colors">
          {{ card.title }}
        </h3>
        
        <p class="text-[#64748B] text-[15px] leading-relaxed whitespace-pre-line font-medium">
          {{ card.description }}
        </p>
      </div>
    }
  </div>
</section>
}
