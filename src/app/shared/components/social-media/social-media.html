<section class="relative py-16 md:py-32 bg-[#0F0F1E] overflow-hidden" dir="rtl">

  <!-- Animated Background Orbs (to fill the empty space) -->
  <div class="absolute top-1/4 left-[10%] w-64 h-64 bg-blue-600/20 rounded-full blur-[80px] animate-pulse"
    style="animation-duration: 4s;"></div>
  <div class="absolute bottom-1/4 right-[10%] w-72 h-72 bg-indigo-600/20 rounded-full blur-[80px] animate-pulse"
    style="animation-duration: 5s; animation-delay: 2s;"></div>
  <div
    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-[#3B82F6]/10 rounded-full blur-[100px] animate-pulse"
    style="animation-duration: 6s; animation-delay: 1s;"></div>

  <!-- Floating Elements / Abstract geometry -->
  <div class="absolute top-20 right-20 w-16 h-16 border-2 border-blue-500/20 rounded-full animate-bounce"
    style="animation-duration: 3s;"></div>
  <div
    class="absolute bottom-20 left-20 w-24 h-24 border border-indigo-500/20 rounded-2xl transform rotate-45 animate-pulse"
    style="animation-duration: 4s;"></div>
  <div class="absolute top-1/3 left-1/4 w-8 h-8 bg-blue-400/20 rounded-full animate-ping"
    style="animation-duration: 3s;"></div>

  <div class="container mx-auto px-4 relative z-10">
    <!-- Header Section -->
    <div class="text-center mb-12 md:mb-16" data-aos="fade-down" data-aos-duration="1000">
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-gray-200 mb-4 tracking-tight">
        تابعنا على فيسبوك
      </h2>
      <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto font-medium">
        انضم إلى مجتمعنا وتابع آخر الأخبار والعروض والدورات التدريبية.
      </p>
    </div>

    <!-- Facebook Card -->
    <div class="max-w-lg mx-auto" data-aos="zoom-in-up" data-aos-duration="1200">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="group block">
        <div
          class="relative bg-[#151525] rounded-[2.5rem] p-8 md:p-10 shadow-2xl hover:shadow-[0_20px_50px_rgba(59,130,246,0.15)] transition-all duration-500 transform hover:-translate-y-3 border border-white/5 hover:border-blue-500/50 overflow-hidden">

          <!-- Animated Background Glow inside card -->
          <div
            class="absolute inset-0 bg-gradient-to-br from-blue-600/10 via-transparent to-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
          </div>

          <!-- Animated Rings -->
          <div
            class="absolute -top-12 -right-12 w-48 h-48 border-[6px] border-blue-500/10 rounded-full opacity-50 group-hover:opacity-100 group-hover:scale-125 transition-all duration-700">
          </div>
          <div
            class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl group-hover:bg-blue-500/20 transition-all duration-500">
          </div>

          <div class="relative z-10 flex flex-col items-center">
            <!-- Facebook Icon Container -->
            <div
              class="w-24 h-24 bg-gradient-to-br from-blue-500 to-blue-700 rounded-[1.5rem] flex items-center justify-center mb-8 shadow-lg shadow-blue-500/30 group-hover:scale-110 group-hover:-rotate-6 transition-transform duration-500">
              <svg class="w-14 h-14 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
              </svg>
            </div>

            <!-- Text Content -->
            <h3 class="text-2xl font-bold text-white mb-3 group-hover:text-blue-400 transition-colors duration-300">
              صفحتنا على فيسبوك
            </h3>
            <p class="text-gray-400 text-center mb-8 text-sm font-medium leading-relaxed">
              تابعنا للحصول على أحدث الأخبار والنصائح التعليمية والتفاعل مع مجتمعنا بصفة مستمرة.
            </p>

            <!-- CTA Button -->
            <div
              class="inline-flex items-center gap-3 bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-2xl font-bold shadow-[0_10px_20px_rgba(37,99,235,0.2)] transition-all duration-300 transform group-hover:scale-105">
              <span>تابعنا الآن</span>
              <svg class="w-5 h-5 rotate-180 group-hover:-translate-x-1 transition-transform duration-300" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                </path>
              </svg>
            </div>
          </div>

          <!-- Decorative Elements -->
          <div
            class="absolute bottom-0 left-0 w-32 h-32 bg-linear-to-tr from-blue-500/10 to-transparent rounded-tr-full">
          </div>
        </div>
      </a>
    </div>

    <!-- Stats or Social Proof (Optional Enhancement) -->
    <div class="mt-12 text-center">
      <p class="text-gray-500 text-sm flex items-center justify-center gap-2">
        <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
        <span>انضم إلى آلاف المتابعين من محبي اللغات</span>
      </p>
    </div>
  </div>
</section>
