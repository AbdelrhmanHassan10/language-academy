<!-- كيف تبدأ؟ section -->
<section class="w-full bg-white py-20 px-4 md:px-8 lg:px-24 flex flex-col items-center overflow-hidden" dir="rtl">
  
  <div class="mb-16 text-center" data-aos="fade-down" data-aos-duration="1000">
    <h2 class="text-3xl md:text-4xl lg:text-[40px] font-cairo font-bold text-[#1e293b] leading-tight mb-4">
      كيف تبدأ؟
    </h2>
    <p class="text-lg md:text-xl font-cairo font-medium text-[#64748B] leading-relaxed">
      خطوات بسيطة للحصول على خدماتنا
    </p>
  </div>

  <div class="relative grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 w-full max-w-[1400px]">
    
    <!-- Optional: Connecting Line for Large Screens (behind cards) -->
    <div class="hidden lg:block absolute top-[5rem] left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-gray-200 to-transparent z-0"></div>

    <!-- Step 1 -->
    <div data-aos="fade-up" data-aos-delay="100" data-aos-duration="800"
      class="relative bg-white border border-gray-100 rounded-[2rem] p-8 flex flex-col items-center text-center shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all duration-300 hover:shadow-[0_15px_40px_rgba(0,102,204,0.08)] hover:-translate-y-2 group z-10">
      
      <!-- Watermark Number -->
      <span class="absolute -top-4 -right-2 text-[120px] font-black text-gray-50 leading-none select-none pointer-events-none transition-transform duration-500 group-hover:scale-110">1</span>
      
      <!-- Icon/Number -->
      <div class="relative z-10 w-20 h-20 rounded-3xl bg-gradient-to-br from-[#0066CC] to-blue-500 text-white flex items-center justify-center text-3xl font-black mb-6 shadow-lg shadow-blue-500/30 transform transition-transform duration-500">
        01
      </div>
      
      <h3 class="relative z-10 text-xl font-cairo font-bold text-[#1e293b] mb-3">التسجيل</h3>
      <p class="relative z-10 text-[15px] font-medium text-[#64748B] leading-relaxed">سجّل في المنصة واختر الخدمة المناسبة</p>
    </div>

    <!-- Step 2 -->
    <div data-aos="fade-up" data-aos-delay="200" data-aos-duration="800"
      class="relative bg-white border border-gray-100 rounded-[2rem] p-8 flex flex-col items-center text-center shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all duration-300 hover:shadow-[0_15px_40px_rgba(0,102,204,0.08)] hover:-translate-y-2 group z-10 lg:mt-8">
      
      <!-- Watermark Number -->
      <span class="absolute -top-4 -right-2 text-[120px] font-black text-gray-50 leading-none select-none pointer-events-none transition-transform duration-500 group-hover:scale-110">2</span>
      
      <!-- Icon/Number -->
      <div class="relative z-10 w-20 h-20 rounded-3xl bg-gradient-to-br from-[#00B2A9] to-teal-400 text-white flex items-center justify-center text-3xl font-black mb-6 shadow-lg shadow-teal-500/30 transform transition-transform duration-500">
        02
      </div>
      
      <h3 class="relative z-10 text-xl font-cairo font-bold text-[#1e293b] mb-3">الدفع</h3>
      <p class="relative z-10 text-[15px] font-medium text-[#64748B] leading-relaxed">ادفع بسهولة من خلال طرق الدفع المتعددة</p>
    </div>

    <!-- Step 3 -->
    <div data-aos="fade-up" data-aos-delay="300" data-aos-duration="800"
      class="relative bg-white border border-gray-100 rounded-[2rem] p-8 flex flex-col items-center text-center shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all duration-300 hover:shadow-[0_15px_40px_rgba(0,102,204,0.08)] hover:-translate-y-2 group z-10">
      
      <!-- Watermark Number -->
      <span class="absolute -top-4 -right-2 text-[120px] font-black text-gray-50 leading-none select-none pointer-events-none transition-transform duration-500 group-hover:scale-110">3</span>
      
      <!-- Icon/Number -->
      <div class="relative z-10 w-20 h-20 rounded-3xl bg-gradient-to-br from-[#0066CC] to-blue-500 text-white flex items-center justify-center text-3xl font-black mb-6 shadow-lg shadow-blue-500/30 transform transition-transform duration-500">
        03
      </div>
      
      <h3 class="relative z-10 text-xl font-cairo font-bold text-[#1e293b] mb-3">البدء</h3>
      <p class="relative z-10 text-[15px] font-medium text-[#64748B] leading-relaxed">ابدأ في الاستفادة من الخدمة المطلوبة</p>
    </div>

    <!-- Step 4 -->
    <div data-aos="fade-up" data-aos-delay="400" data-aos-duration="800"
      class="relative bg-white border border-gray-100 rounded-[2rem] p-8 flex flex-col items-center text-center shadow-[0_4px_20px_rgba(0,0,0,0.02)] transition-all duration-300 hover:shadow-[0_15px_40px_rgba(0,102,204,0.08)] hover:-translate-y-2 group z-10 lg:mt-8">
      
      <!-- Watermark Number -->
      <span class="absolute -top-4 -right-2 text-[120px] font-black text-gray-50 leading-none select-none pointer-events-none transition-transform duration-500 group-hover:scale-110">4</span>
      
      <!-- Icon/Number -->
      <div class="relative z-10 w-20 h-20 rounded-3xl bg-gradient-to-br from-[#00B2A9] to-teal-400 text-white flex items-center justify-center text-3xl font-black mb-6 shadow-lg shadow-teal-500/30 transform transition-transform duration-500">
        04
      </div>
      
      <h3 class="relative z-10 text-xl font-cairo font-bold text-[#1e293b] mb-3">الشهادة</h3>
      <p class="relative z-10 text-[15px] font-medium text-[#64748B] leading-relaxed">احصل على شهادتك أو مستنداتك المعتمدة</p>
    </div>

  </div>
</section>
