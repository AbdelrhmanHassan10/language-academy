<section
  class="relative w-full min-h-[450px] lg:min-h-[550px] bg-[#0066CC] pt-32 lg:pt-48 pb-16 lg:pb-24 flex flex-col items-center justify-center gap-6 text-white text-center px-4 overflow-hidden"
>
  <!-- Decorative Background Shapes -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute -top-20 -right-20 w-72 h-72 bg-white/10 rounded-full blur-3xl animate-pulse" style="animation-duration: 4s;"></div>
    <div class="absolute -bottom-20 -left-20 w-96 h-96 bg-cyan-400/20 rounded-full blur-3xl animate-pulse" style="animation-duration: 6s;"></div>
    
    <!-- Subtle Grid Pattern -->
    <div class="absolute inset-0 bg-[url('/images/grid-pattern.svg')] opacity-5 mix-blend-overlay"></div>
  </div>

  <div class="relative z-10 flex flex-col items-center gap-4 w-full">
    @if (servicesAbout(); as data) {
      <h2 class="text-4xl md:text-5xl lg:text-[64px] font-black leading-tight global-text-gradient-light drop-shadow-lg" data-aos="fade-up" data-aos-duration="800">
        {{ data.title }}
      </h2>
      <p class="text-lg md:text-2xl lg:text-[26px] font-medium text-white/90 max-w-4xl mx-auto leading-relaxed mt-4" data-aos="fade-up" data-aos-delay="200" data-aos-duration="800">
        {{ data.description }}
      </p>
    }

    @if (showSearch()) {
      <div class="w-full max-w-2xl mt-10 global-animate-float" data-aos="zoom-in" data-aos-delay="400" data-aos-duration="800">
        <div class="flex items-center bg-white/95 backdrop-blur-md rounded-full shadow-[0_15px_40px_rgba(0,0,0,0.2)] overflow-hidden p-2 pl-6 gap-3 border border-white/20 global-btn-glow">
          <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center shrink-0">
            <i class="fa-solid fa-magnifying-glass text-[#0066CC] text-lg"></i>
          </div>
          <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onInput()" placeholder="ابحث عن كورس أو دبلومة..."
            class="flex-1 py-4 text-gray-800 text-lg font-medium outline-none bg-transparent text-right placeholder:text-gray-400"
            dir="rtl" />
          @if (searchTerm) {
          <button (click)="onClear()" class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
          }
        </div>
      </div>
    }
  </div>
</section>
