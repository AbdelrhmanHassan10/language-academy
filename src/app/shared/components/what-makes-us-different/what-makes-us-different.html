<!-- ما يميزنا: What Makes Us Different Section -->
<section class="bg-[#F8FAFC] py-16 px-4 md:px-8 lg:px-24 w-full" dir="rtl">
  <div class="container mx-auto max-w-[1400px]">
    <div class="flex flex-col gap-3 items-center mb-12" data-aos="fade-up">
      <h2 class="font-cairo text-3xl md:text-4xl font-bold leading-[2.5rem] text-[#0066CC] text-center">
        ما يميزنا
      </h2>
      <p class="font-cairo text-lg md:text-xl text-[#64748B] font-medium leading-7 text-center">
        مجموعة من المزايا التي تجعلنا الخيار الأمثل
      </p>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (feature of features; track feature.text; let i = $index) {
      <div
        data-aos="fade-up" [attr.data-aos-delay]="(i % 4) * 100"
        class="group bg-white border border-gray-100/80 rounded-xl px-5 py-6 flex items-center justify-start gap-4 shadow-[0_2px_15px_rgba(0,0,0,0.02)] hover:shadow-[0_10px_30px_rgba(0,102,204,0.06)] hover:border-blue-100 transition-all duration-300 hover:-translate-y-1 h-full min-h-[96px]">
        
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0 group-hover:scale-110 transition-transform duration-300">
          <path
            d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
            stroke="#0066CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 12L11 14L15 10" stroke="#0066CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
  
        <span class="font-cairo text-[15px] lg:text-base text-[#475569] font-semibold leading-relaxed text-right flex-1">
          {{ feature.text }}
        </span>
      </div>
      }
    </div>
  </div>
</section>
