<!-- ما يميزنا: What Makes Us Different Section -->
<section class="bg-white py-16 px-4 md:px-8 lg:px-24 w-full border-t border-gray-100" dir="rtl">
  <div class="container mx-auto max-w-[1400px]">
    
    <div class="flex flex-col gap-4 items-center mb-16" data-aos="fade-up">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-teal-50 border border-teal-100 text-[#00B2A9] font-bold text-sm">
        <i class="pi pi-bolt"></i>
        سر التميز
      </div>
      <h2 class="text-3xl md:text-4xl font-black leading-tight text-[#1e293b] text-center">
        ما يُميز <span class="text-[#0066CC]">مركزنا</span> عن البقية؟
      </h2>
      <p class="text-lg md:text-xl text-[#64748B] font-medium leading-relaxed text-center max-w-2xl">
        مجموعة من المزايا الحصرية التي تجعلنا الخيار الأول للطلاب والمهنيين
      </p>
    </div>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (feature of features; track feature.text; let i = $index) {
      <div
        data-aos="fade-up" [attr.data-aos-delay]="(i % 4) * 100"
        class="group relative bg-[#F8FAFC] border border-gray-100 rounded-2xl px-6 py-6 flex items-center justify-start gap-4 hover:shadow-[0_15px_30px_rgba(0,102,204,0.06)] hover:bg-white transition-all duration-300 hover:-translate-y-1 h-full min-h-[96px] overflow-hidden cursor-default">
        
        <!-- Hover indicator line -->
        <div class="absolute right-0 top-0 bottom-0 w-1 bg-gradient-to-b from-[#0066CC] to-[#00B2A9] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

        <div class="w-10 h-10 rounded-full bg-blue-100/50 flex items-center justify-center shrink-0 group-hover:bg-blue-50 transition-colors duration-300">
          <i class="pi pi-check text-[#0066CC] text-lg font-bold"></i>
        </div>
  
        <span class="text-[16px] text-[#334155] font-bold leading-relaxed text-right flex-1 group-hover:text-[#0066CC] transition-colors duration-300">
          {{ feature.text }}
        </span>
      </div>
      }
    </div>
    
  </div>
</section>
